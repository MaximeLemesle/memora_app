name: Flutter CI

on:
  push:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest

    steps:
      # 1) Get the code
      - name: Checkout code
      - uses: actions/checkout@v3

      # 2) Install Flutter
      - name: Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}

      # 3) Get the Flutter version
      - name: Flutter version
        run: flutter --version

      # 4) Clean the cache
      - name: Cache Pub
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ~/.flutter
          key: ${{ runner.os }}-flutter-${{ matrix.flutter-version }}

      # 5) Clean the project
      - name: Clean Flutter project
        run: flutter clean

      # 6) Get the dependencies
      - name: Get dependencies
        run: flutter pub get

      # 5) Analyze
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      # 6) Execute unit tests
      - name: Flutter test
        run: flutter test --coverage
