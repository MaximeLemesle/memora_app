image: ghcr.io/cirruslabs/flutter

stages:
  - lints
  - tests
  # - build
  # - deploy

# cache:
#   key: ${CI_COMMIT_REF_SLUG}
#   paths:
#     - .pub-cache

lints:
  stage: lints
  before_script:
    - bash reconfigure.sh
  script:
    - flutter analyze

tests:
  stage: tests
  script:
    - flutter test --coverage ./lib
    - lcov -r coverage/lcov.info '*/__test*__/*' -o coverage/lcov_cleaned.info
    - genhtml coverage/lcov_cleaned.info --output=coverage
  artifacts:
    paths:
      - coverage
